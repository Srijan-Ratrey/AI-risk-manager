# Cost model — every rupee assumption in this project lives here.
#
# This file is versioned and its version is stamped into every audit-log row,
# so any historical decision can be replayed against the cost model that was
# in force when it was made.
#
# HONESTY NOTE: IEEE-CIS TransactionAmt is denominated in USD (US e-commerce,
# Vesta 2019). We re-denominate at a single fixed declared rate below. The
# METHOD transfers to an Indian merchant unchanged; the absolute rupee figures
# are illustrative, not measured from Indian payment traffic.
version: "1.0.0"
currency: INR

# A DECLARED ASSUMPTION, NOT A SPOT RATE. Two reasons it is not simply "the"
# exchange rate: the transactions are from 2019, when USD/INR was ~70, while
# the rate as of 2026-09 is ~94 -- so converting 2019 amounts at a 2026 rate
# is a modelling choice either way, and there is no single correct answer.
#
# It turns out not to matter. run_rate_sensitivity.py sweeps 70-100 and the
# cost-optimal operating point stays at 0.130 throughout; only the absolute
# magnitudes scale (headline Rs 88,660 at 70, Rs 128,810 at 100). t*(a)'s
# limits do not move at all, because they are fixed_fp/(fixed_fp+fixed_fn)
# and margin_rate/(margin_rate+chargeback_multiplier) -- neither contains
# the rate. See reports/rate_sensitivity.csv.
usd_to_inr: 88.0

# ---------------------------------------------------------------------------
# False negative: fraud approved. Merchant eats the chargeback.
# ---------------------------------------------------------------------------
false_negative:
  # Fraction of transaction value lost. 1.0 = goods/service already delivered
  # and the full amount is clawed back.
  chargeback_amount_multiplier: 1.0
  # Flat scheme + gateway dispute fee, charged per chargeback regardless of value.
  chargeback_fee_inr: 1000.0
  # Ops time to handle the dispute.
  ops_handling_inr: 200.0

# ---------------------------------------------------------------------------
# False positive: legitimate customer blocked.
#
# The subtle point: you lose the MARGIN on that order, not the order value.
# Treating a blocked ₹10,000 order as a ₹10,000 loss overstates FP cost ~8x
# and pushes the optimal threshold far too high.
# ---------------------------------------------------------------------------
false_positive:
  # LOAD-BEARING. Of the eight constants here, only this one and
  # chargeback_amount_multiplier move the operating point under +/-50%, and
  # they are one mechanism: both set the ratio between what a missed fraud
  # costs and what a false block costs. Ordered by that ratio:
  #
  #   7.1x (margin 6%)      -> threshold 0.037, headline Rs 392,790  significant
  #   5.9x (SHIPPED)        -> threshold 0.130, headline Rs 112,750  significant
  #   5.1x (margin 18%)     -> threshold 0.142, headline Rs  -3,419  not significant
  #   4.6x (recover half)   -> threshold 0.142, headline Rs -48,814  SIGNIFICANTLY NEGATIVE
  #
  # Around 5x the advantage vanishes; below it, cost-optimising is measurably
  # WORSE than optimising F1. This project's thesis is therefore a claim about
  # merchants with thin margins and unrecoverable chargebacks. Substitute your
  # own numbers and re-run before trusting the headline.
  # See reports/margin_sensitivity.csv.
  margin_rate: 0.12
  churn_probability: 0.05
  customer_ltv_inr: 3000.0
  support_contact_inr: 100.0

# ---------------------------------------------------------------------------
# Manual review band.
# ---------------------------------------------------------------------------
review:
  cost_per_review_inr: 50.0
  # Operational ceiling. A model that routes 30% of traffic to humans is
  # unusable no matter how precise it is.
  max_review_rate: 0.05
